<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f7f7f5">
<link rel="manifest" href="manifest.json">

<title>FODMAP Check</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #f7f6f2;
    color: #181818;

    font-family:
        "Avenir Next";
    font-weight: 300;

    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 390px;

    padding:
        calc(30px + env(safe-area-inset-top))
        22px
        calc(30px + env(safe-area-inset-bottom));

    text-align: center;
}
 
h1 {
    font-size: 27px;
    font-weight: 500;
    
    letter-spacing: 1px;

    margin: 0 0 22px;
}

.search-box {
    height: 50px;

    background: #ffffff;
    border-radius: 15px;

    padding: 0 16px;

    display: flex;
    align-items: center;

    box-shadow: 0 3px 15px rgba(0,0,0,0.055);
}

    .apple-icon {
    font-size: 18px;
    margin-right: 14px;
    flex-shrink: 0;
}

    input {
    border: none;
    outline: none;

    width: 100%;

    font-family: inherit;
    font-size: 17px;
    font-weight: 300;

    background: transparent;
}

input::placeholder {
    color: #999;
    font-weight: 300;
}

.result {
    margin-top: 38px;
}

.food-name {
    font-size: 26px;
    font-weight: 300;

    letter-spacing: 0;

    margin-bottom: 21px;

    text-transform: capitalize;
}

.circle {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto;
}

.green {
    background: #A3BD3A;
}

.orange {
    background: #E58A25;
}

.red {
    background: #A51D1D;
}

.portion {
    font-size: 18px;
    font-weight: 300;

    margin-top: 17px;
}

.not-found {
    margin-top: 38px;

    color: #888;

    font-size: 16px;
    font-weight: 300;
}

.hidden {
    display: none;
}

</style>
</head>


<body>

<div class="app">

    <h1>FODMAP Check</h1>


    <div class="search-box">
       
        <span class="apple-icon">🍏</span>
        
        <input
            id="search"
            type="text"
            placeholder="Cerca alimento..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

    </div>


    <div id="result" class="result hidden">

        <div id="foodName" class="food-name"></div>

        <div id="circle" class="circle"></div>

        <div id="portion" class="portion"></div>

    </div>


    <div id="notFound" class="not-found hidden">
        Alimento non trovato
    </div>

</div>


<script src="app.js"></script>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker.register("./sw.js");

    });

}

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f7f7f5">
<link rel="manifest" href="manifest.json">

<title>Is this FODMAP safe?</title>

<style>

* {
    box-sizing: border-box;
}
    
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #f7f6f2;
    color: #181818;

    font-family: "Avenir Next";
    font-weight: 300;
}

.app {
    position: relative;

    width: 100%;
    max-width: 390px;
    height: 100vh;

    padding:
        calc(12vh + env(safe-area-inset-top))
        22px
        calc(30px + env(safe-area-inset-bottom));

    text-align: center;
    margin: 0 auto;

    overflow: hidden;
}

.app-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
}
    
h1 {
    font-size: 25px;
    font-weight: 400;
    
    letter-spacing: 1px;

    margin: 0 0 22px;
}

.fodmap-title {
    color: #88A532;
    font-weight: 600;
}
    
.search-box {
    height: 50px;

    background: #ffffff;
    border-radius: 15px;

    padding: 0 16px;

    display: flex;
    align-items: center;

    box-shadow: 0 3px 15px rgba(0,0,0,0.055);
}

    input {
    border: none;
    outline: none;

    width: 100%;

    font-family: inherit;
    font-size: 17px;
    font-weight: 300;

    background: transparent;
}

input::placeholder {
    color: #999;
    font-weight: 300;
}

.result {
    position: absolute;
    top: 55%;
    left: 0;
    right: 0;

    text-align: center;
}

.food-name {
    font-size: 22px;
    font-weight: 300;

    letter-spacing: 0;
    text-align: center;
    margin-bottom: 21px;

    text-transform: capitalize;
}

.circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto;
}

.green {
    background: #A3BD3A;
}

.red {
    background: #A51D1D;
}

.portion {
    font-size: 18px;
    font-weight: 300;
    text-align: center;
    margin-top: 17px;
}

.not-found {
    margin-top: 38px;
    text-align: center;
    color: #888;

    font-size: 16px;
    font-weight: 300;
}

.hidden {
    display: none;
}

</style>
</head>


<body>

<div class="app">

    <img src="icon.png" class="app-logo" alt="">

    <h1>Is this <span class="fodmap-title">FODMAP</span> safe?</h1>


    <div class="search-box">
       
        <input
            id="search"
            type="text"
            placeholder="Cerca alimento..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

    </div>

    </div>


    <div id="result" class="result hidden">

        <div id="foodName" class="food-name"></div>

        <div id="circle" class="circle"></div>

        <div id="portion" class="portion"></div>

    </div>


    <div id="notFound" class="not-found hidden">
        Alimento non trovato
    </div>

</div>


<script src="app.js"></script>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker.register("./sw.js");

    });

}

</script>


</body>
</html>

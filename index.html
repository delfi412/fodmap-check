<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FODMAP Check</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f6f6f4;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 430px;
    padding: 55px 24px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin: 0 0 28px;
    letter-spacing: -1px;
}

.search-box {
    background: white;
    border-radius: 18px;
    padding: 15px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    display: flex;
    align-items: center;
}

.search-icon {
    font-size: 22px;
    margin-right: 10px;
}

input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 18px;
    background: transparent;
}

.result {
    margin-top: 55px;
}

.food-name {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 28px;
    text-transform: capitalize;
}

.circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto 24px;
}

.green {
    background: #34c759;
}

.orange {
    background: #ff9500;
}

.red {
    background: #ff3b30;
}

.status {
    font-size: 27px;
    font-weight: 800;
}

.portion {
    font-size: 20px;
    font-weight: 600;
    margin-top: 12px;
}

.message {
    margin-top: 35px;
    color: #777;
    font-size: 15px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="app">

    <h1>FODMAP Check</h1>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
            id="search"
            type="text"
            placeholder="Cerca alimento..."
            autocomplete="off"
        >
    </div>

    <div id="result" class="result hidden">

        <div id="foodName" class="food-name"></div>

        <div id="circle" class="circle"></div>

        <div id="status" class="status"></div>

        <div id="portion" class="portion"></div>

    </div>

    <div id="message" class="message">
        Prova a cercare mela, carota, cipolla, banana o fragola
    </div>

</div>


<script>

const foods = {

    mela: {
        color: "orange",
        status: "ARANCIONE",
        portion: "Massimo: 20 g"
    },

    carota: {
        color: "green",
        status: "VERDE",
        portion: ""
    },

    cipolla: {
        color: "red",
        status: "ROSSO",
        portion: ""
    },

    banana: {
        color: "orange",
        status: "ARANCIONE",
        portion: "Massimo: 100 g"
    },

    fragola: {
        color: "green",
        status: "VERDE",
        portion: ""
    }

};


const search = document.getElementById("search");
const result = document.getElementById("result");
const foodName = document.getElementById("foodName");
const circle = document.getElementById("circle");
const status = document.getElementById("status");
const portion = document.getElementById("portion");
const message = document.getElementById("message");


search.addEventListener("input", function() {

    const query = search.value
        .trim()
        .toLowerCase();

    if (query === "") {

        result.classList.add("hidden");

        message.textContent =
            "Prova a cercare mela, carota, cipolla, banana o fragola";

        return;
    }


    const food = Object.keys(foods).find(function(name) {

        return name.includes(query);

    });


    if (!food) {

        result.classList.add("hidden");

        message.textContent =
            "Alimento non trovato";

        return;
    }


    const data = foods[food];


    foodName.textContent = food;

    circle.className =
        "circle " + data.color;

    status.textContent =
        data.status;

    portion.textContent =
        data.portion;

    result.classList.remove("hidden");

    message.textContent = "";

});

</script>

</body>
</html>
